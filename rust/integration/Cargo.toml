# Consumer crate: uses the packaged crate like a user would (Docker replaces `..` with the
# unpacked `.crate`), runs the integration tests and the conformance runner.
[package]
name = "grow-better-stack-logs-integration"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
grow-better-stack-logs = { path = "..", features = ["testing", "blocking"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1.0.120"
tracing = { version = "0.1.40", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["std", "registry"] }
log = { version = "0.4.22", features = ["std", "kv"] }

[workspace]
