# Service-owned (not generated by sdk-kit): live checks of the Python package against the real
# Better Stack Logs service (GRO-1385). Ingests events with a unique marker (JSON, NDJSON,
# MessagePack, OTLP protobuf + JSON, log client) and reads them back over the SQL API
# (live/live_test.py, see docs/compatibility.md "Live checks").
#
# Organisation secrets (all six required): BETTERSTACK_INGEST_HOST, BETTERSTACK_SOURCE_TOKEN,
# BETTERSTACK_QUERY_HOST, BETTERSTACK_QUERY_USER, BETTERSTACK_QUERY_PASSWORD,
# BETTERSTACK_SOURCE_TABLE. Without them the run ends green with a notice and the live job is
# skipped.
name: live

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1" # Mondays 05:37 UTC

permissions:
  contents: read

concurrency:
  group: live-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  credentials:
    name: credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the live secrets
        id: check
        env:
          BETTERSTACK_INGEST_HOST: ${{ secrets.BETTERSTACK_INGEST_HOST }}
          BETTERSTACK_SOURCE_TOKEN: ${{ secrets.BETTERSTACK_SOURCE_TOKEN }}
          BETTERSTACK_QUERY_HOST: ${{ secrets.BETTERSTACK_QUERY_HOST }}
          BETTERSTACK_QUERY_USER: ${{ secrets.BETTERSTACK_QUERY_USER }}
          BETTERSTACK_QUERY_PASSWORD: ${{ secrets.BETTERSTACK_QUERY_PASSWORD }}
          BETTERSTACK_SOURCE_TABLE: ${{ secrets.BETTERSTACK_SOURCE_TABLE }}
        run: |
          missing=""
          for name in BETTERSTACK_INGEST_HOST BETTERSTACK_SOURCE_TOKEN BETTERSTACK_QUERY_HOST \
                      BETTERSTACK_QUERY_USER BETTERSTACK_QUERY_PASSWORD BETTERSTACK_SOURCE_TABLE; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live checks skipped::secrets not set:$missing (add them as organisation secrets to run the live checks)"
            echo "Live checks skipped: secrets not set:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  live:
    name: live (python)
    needs: credentials
    if: needs.credentials.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Lint the live suite
        run: make -C live PYTHON="${{ steps.python.outputs.python-path }}" lint

      - name: Live checks
        env:
          BETTERSTACK_INGEST_HOST: ${{ secrets.BETTERSTACK_INGEST_HOST }}
          BETTERSTACK_SOURCE_TOKEN: ${{ secrets.BETTERSTACK_SOURCE_TOKEN }}
          BETTERSTACK_QUERY_HOST: ${{ secrets.BETTERSTACK_QUERY_HOST }}
          BETTERSTACK_QUERY_USER: ${{ secrets.BETTERSTACK_QUERY_USER }}
          BETTERSTACK_QUERY_PASSWORD: ${{ secrets.BETTERSTACK_QUERY_PASSWORD }}
          BETTERSTACK_SOURCE_TABLE: ${{ secrets.BETTERSTACK_SOURCE_TABLE }}
        run: make -C live PYTHON="${{ steps.python.outputs.python-path }}" live
